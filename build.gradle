buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

apply plugin: 'com.android.application'

android {
    namespace "de.dennis.dennisos"
    compileSdk 19

    signingConfigs {
        debug {
            def configuredKeystore = System.getenv("DENNISOS_KEYSTORE_FILE")
            if (!configuredKeystore && System.getenv("GITHUB_ACTIONS") == "true") {
                configuredKeystore = "${System.getProperty('user.home')}/.android/debug.keystore"
            }
            if (configuredKeystore) {
                storeFile file(configuredKeystore)
                storePassword System.getenv("DENNISOS_KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("DENNISOS_KEY_ALIAS") ?: "androiddebugkey"
                keyPassword System.getenv("DENNISOS_KEY_PASSWORD") ?: "android"
            }
        }
    }

    defaultConfig {
        applicationId "de.dennis.dennisos"
        minSdk 19
        targetSdk 19
        versionCode Integer.parseInt(System.getenv("DENNISOS_VERSION_CODE") ?: "35")
        versionName System.getenv("DENNISOS_VERSION_NAME") ?: "3.4-Fixes"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'commons-io:commons-io:2.11.0'
}
